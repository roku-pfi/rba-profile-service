[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rba-profile-service"
version = "0.1.0"
description = "Async consumer: DecisionMade → update Redis ProfileState + profile history."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Juan Ignacio Gonzalez" }]
dependencies = [
    "pydantic>=2.6",
    "pydantic-settings>=2.3",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
    "redis>=5.0",
    "pika>=1.3",
    "rba-features>=0.1.1",
    "rba-contracts>=0.1.1",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
rba-profile-service = "rba_profile_service.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
